<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DEKA SIR CLASSES</title>
  <script>
    // Redirect all 404s to your SPA with the path as a hash
    var path = window.location.pathname;
    var hash = window.location.hash;
    if (path !== '/' && path !== '/index.html') {
      window.location.href = '/#' + path + hash;
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
